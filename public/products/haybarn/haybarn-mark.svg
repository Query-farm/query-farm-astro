<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Haybarn">
  <title>Haybarn</title>
  <!--
    Sibling of public/mark-strata-sun.svg: same palette, same flat hard-edged
    construction, no gradients or strokes.

    Two things carry the silhouette and are easy to break:

    1. The gambrel. A barn roof only reads if the two pitches are genuinely
       different — most of the DROP on the lower slope, most of the RUN on the
       upper. Here that is 67 degrees then 24. Earlier passes used 54/40, which
       renders as a single line and turns the mark into a generic house.
    2. The eave overhangs the wall (x2..62 against x8..56). Without that step
       the roof and wall read as one tapered block.

    Three flat values only — dark roof, gold wall, ink bay — so unlike the
    four-band Query.Farm disc this needs no reduced small-size variant. It is
    legible down to 16px as-is. Every placement sits it on a light ground (the
    icon tiles are near-white even inside .on-dark), so the sun-800 roof always
    has separation behind it.
  -->
  <path d="M2 36 L9.5 18 L32 8 L54.5 18 L62 36 Z" fill="#7a5230"/>
  <rect x="8" y="36" width="48" height="22" fill="#d9a441"/>
  <path d="M21 58 V51 A11 11 0 0 1 43 51 V58 Z" fill="#211a12"/>
</svg>
