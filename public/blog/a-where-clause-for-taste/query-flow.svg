<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">What the two ATTACH statements actually build</title>
  <desc id="flow-desc">DuckDB sits on one machine and spawns two VGI workers as subprocesses, exchanging Apache Arrow batches with them over stdio. The Hacker News worker calls the public Hacker News API; the TypeSafe worker calls the TypeSafe API, which runs the Jev model. There is no install step, though uv keeps the built workers in a local cache.</desc>

  <defs>
    <clipPath id="hn-clip"><rect x="572" y="106" width="30" height="30" rx="6"/></clipPath>
  </defs>

  <g font-family="Commissioner, system-ui, sans-serif">

    <!-- machine boundary -->
    <rect x="18" y="54" width="446" height="292" rx="12" fill="#f2ecde" stroke="#cfc4ad" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="34" y="44" font-size="12" font-weight="700" letter-spacing="0.07em" fill="#5d4632">YOUR MACHINE · NO INSTALL STEP · uv KEEPS A CACHE</text>

    <!-- DuckDB / haybarn -->
    <rect x="34" y="146" width="160" height="100" rx="10" fill="#2a2420"/>
    <circle cx="114" cy="178" r="19" fill="#f7f3ea"/>
    <svg x="98" y="162" width="32" height="32" viewBox="217.6 10 334.4 334.4" aria-hidden="true">
      <path d="M384.8,344.4L384.8,344.4c-92.5,0-167.2-74.7-167.2-167.2l0,0C217.6,84.7,292.3,10,384.8,10l0,0 C477.3,10,552,84.7,552,177.2l0,0C552,269.6,477.3,344.4,384.8,344.4z"/>
      <path fill="#fff100" d="M474.2,152.2h-32.8v49.5h32.8c13.7,0,24.9-11.3,24.9-24.9S487.9,152.2,474.2,152.2"/>
      <path fill="#fff100" d="M280.7,177.1c0,38.2,31.1,69.3,69.3,69.3c38.2,0,69.3-31.1,69.3-69.3s-31.1-69.3-69.3-69.3 C311.8,107.8,280.7,138.9,280.7,177.1L280.7,177.1"/>
    </svg>
    <text x="114" y="218" font-size="14" font-weight="700" text-anchor="middle" fill="#f7f3ea">DuckDB</text>
    <text x="114" y="235" font-size="11.5" text-anchor="middle" fill="#cfc4ad">haybarn-cli · vgi</text>

    <!-- curves DuckDB -> workers -->
    <g fill="none" stroke-width="2.5" stroke-linecap="round">
      <path d="M194 180C224 180 224 122 252 122" stroke="#8a5f38"/>
      <path d="M194 212C224 212 224 278 252 278" stroke="#8a5f38"/>
    </g>
    <text x="350" y="204" font-size="12" text-anchor="middle" fill="#5d4632">Apache Arrow batches, over stdio</text>

    <!-- worker: hackernews -->
    <rect x="252" y="92" width="196" height="60" rx="10" fill="#f7f3ea" stroke="#8a5f38" stroke-width="1.5"/>
    <text x="350" y="116" font-size="13" font-weight="700" text-anchor="middle" fill="#211a12">vgi-hackernews</text>
    <text x="350" y="135" font-size="11.5" text-anchor="middle" fill="#5d4632">subprocess, spawned by uvx</text>

    <!-- worker: typesafe -->
    <rect x="252" y="248" width="196" height="60" rx="10" fill="#f7f3ea" stroke="#a82d85" stroke-width="1.5"/>
    <text x="350" y="272" font-size="13" font-weight="700" text-anchor="middle" fill="#211a12">vgi-typesafe</text>
    <text x="350" y="291" font-size="11.5" text-anchor="middle" fill="#5d4632">subprocess, spawned by uvx</text>

    <!-- worker -> API arrows, crossing the boundary -->
    <g stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M448 122H556" stroke="#5f5750"/>
      <path d="M549 115L557 122L549 129" stroke="#5f5750" stroke-linejoin="round"/>
      <path d="M448 278H556" stroke="#a82d85"/>
      <path d="M549 271L557 278L549 285" stroke="#a82d85" stroke-linejoin="round"/>
    </g>
    <text x="502" y="112" font-size="11" text-anchor="middle" fill="#5d4632">HTTPS</text>
    <text x="502" y="268" font-size="11" text-anchor="middle" fill="#a82d85">500 requests</text>
    <text x="502" y="300" font-size="11" text-anchor="middle" fill="#5d4632">8 at a time</text>

    <!-- API: hacker news -->
    <rect x="558" y="92" width="184" height="60" rx="10" fill="#efe9db" stroke="#cfc4ad"/>
    <image x="572" y="106" width="30" height="30" clip-path="url(#hn-clip)" href="data:image/png;base64," preserveAspectRatio="xMidYMid slice"/>
    <text x="612" y="118" font-size="13" font-weight="700" fill="#211a12">Hacker News API</text>
    <text x="612" y="136" font-size="11.5" fill="#5d4632">500 newest · 1.8 s</text>

    <!-- API: typesafe / jev -->
    <rect x="558" y="236" width="184" height="84" rx="10" fill="#e551ba"/>
    <circle cx="590" cy="278" r="18" fill="#f7f3ea"/>
    <image x="575" y="263" width="30" height="30" href="data:image/png;base64,"/>
    <text x="616" y="266" font-size="13" font-weight="700" fill="#171717">TypeSafe API</text>
    <text x="616" y="284" font-size="12" fill="#3b1030">jev-1.13.0</text>
    <text x="616" y="302" font-size="11.5" fill="#3b1030">~16 s · $0.0073</text>

    <!-- footer note -->
    <text x="18" y="368" font-size="11.5" fill="#5d4632">Two <tspan font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">ATTACH</tspan> statements, no service and no container — but uv does build each worker once and keep it (<tspan font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">uv cache dir</tspan>).</text>
  </g>
</svg>
