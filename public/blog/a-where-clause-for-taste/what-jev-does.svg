<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="jev-title jev-desc">
  <title id="jev-title">An LLM returns a string you have to parse; Jev returns a typed value</title>
  <desc id="jev-desc">Two columns. On the left, a general-purpose language model takes a prompt, emits tokens one at a time into a block of JSON wrapped in a code fence, which then has to be parsed and validated, and can still come back malformed. On the right, Jev takes the same state plus a typed question whose answers are enumerated in advance, and returns the number 0.88 directly, with no string in between.</desc>

  <g font-family="Commissioner, system-ui, sans-serif">

    <!-- ============ LEFT: System Two ============ -->
    <text x="24" y="22" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#5d4632">SYSTEM TWO · A LANGUAGE MODEL</text>

    <rect x="24" y="36" width="316" height="44" rx="8" fill="#efe9db" stroke="#cfc4ad"/>
    <text x="40" y="57" font-size="13" fill="#211a12">"Rate this story 0-1 and reply</text>
    <text x="40" y="73" font-size="13" fill="#211a12">with JSON only, I mean it"</text>

    <path d="M182 84V104" stroke="#a9825a" stroke-width="2" stroke-linecap="round"/>
    <path d="M176 98L182 105L188 98" fill="none" stroke="#a9825a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="24" y="110" width="316" height="38" rx="8" fill="#2a2420"/>
    <text x="182" y="134" font-size="13" text-anchor="middle" fill="#f7f3ea">token → token → token → token →</text>

    <path d="M182 152V172" stroke="#a9825a" stroke-width="2" stroke-linecap="round"/>
    <path d="M176 166L182 173L188 166" fill="none" stroke="#a9825a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="24" y="178" width="316" height="86" rx="8" fill="#1a1512"/>
    <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="12.5" fill="#e2d8c4">
      <text x="40" y="200">```json</text>
      <text x="40" y="220">{ "score": 0.88 }</text>
      <text x="40" y="240">```</text>
      <text x="40" y="258" fill="#f387a1">Hope that helps!</text>
    </g>

    <path d="M182 268V288" stroke="#a9825a" stroke-width="2" stroke-linecap="round"/>
    <path d="M176 282L182 289L188 282" fill="none" stroke="#a9825a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="24" y="294" width="316" height="44" rx="8" fill="#efe9db" stroke="#cfc4ad" stroke-dasharray="4 3"/>
    <text x="182" y="313" font-size="13" text-anchor="middle" fill="#211a12">strip the fence · parse · validate</text>
    <text x="182" y="330" font-size="12.5" text-anchor="middle" fill="#7d5714" font-style="italic">retry when it apologises instead</text>

    <!-- ============ divider ============ -->
    <line x1="380" y1="30" x2="380" y2="344" stroke="#cfc4ad" stroke-width="1" stroke-dasharray="3 5"/>

    <!-- ============ RIGHT: System One ============ -->
    <text x="420" y="22" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#a82d85">SYSTEM ONE · JEV</text>

    <rect x="420" y="36" width="316" height="62" rx="8" fill="#efe9db" stroke="#cfc4ad"/>
    <text x="436" y="57" font-size="13" fill="#211a12">state: { title, url }</text>
    <text x="436" y="76" font-size="13" fill="#211a12">question: noul</text>
    <text x="436" y="92" font-size="12" fill="#5d4632">answers enumerated before it runs</text>

    <path d="M578 102V126" stroke="#e551ba" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M571 119L578 127L585 119" fill="none" stroke="#e551ba" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="420" y="132" width="316" height="52" rx="8" fill="#e551ba"/>
    <text x="578" y="156" font-size="14" font-weight="700" text-anchor="middle" fill="#171717">one parallel pass</text>
    <text x="578" y="174" font-size="12.5" text-anchor="middle" fill="#3b1030">no tokens, no string, 70–500 ms</text>

    <path d="M578 188V212" stroke="#e551ba" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M571 205L578 213L585 205" fill="none" stroke="#e551ba" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="420" y="218" width="316" height="72" rx="8" fill="#1a1512"/>
    <text x="578" y="256" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" text-anchor="middle" fill="#f7f3ea">0.88</text>
    <text x="578" y="278" font-size="12" text-anchor="middle" fill="#cfc4ad">DOUBLE. Already a DOUBLE.</text>

    <rect x="420" y="300" width="316" height="38" rx="8" fill="#eef3e8" stroke="#45632f"/>
    <text x="578" y="324" font-size="13" text-anchor="middle" fill="#33501f">put it straight in the WHERE clause</text>
  </g>
</svg>
