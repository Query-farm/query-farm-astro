<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="dist-title dist-desc">
  <title id="dist-title">Distribution of interest probabilities across 500 Hacker News stories</title>
  <desc id="dist-desc">A histogram in ten-point buckets. Four stories fall in the 0.1 bucket, 76 in 0.2, 140 in 0.3, 134 in 0.4, 92 in 0.5, 38 in 0.6, 14 in 0.7 and two in 0.8. The bulk of the mass sits below the 0.50 threshold; the tail above it is thin.</desc>

  <g font-family="Commissioner, system-ui, sans-serif" font-size="12" fill="#5d4632">
    <!-- y gridlines -->
    <g stroke="#cfc4ad" stroke-width="1">
      <line x1="48" y1="244" x2="744" y2="244" />
      <line x1="48" y1="171" x2="744" y2="171" stroke-dasharray="2 4" />
      <line x1="48" y1="97"  x2="744" y2="97"  stroke-dasharray="2 4" />
      <line x1="48" y1="24"  x2="744" y2="24"  stroke-dasharray="2 4" />
    </g>
    <g text-anchor="end" font-variant-numeric="tabular-nums">
      <text x="40" y="248">0</text>
      <text x="40" y="175">50</text>
      <text x="40" y="101">100</text>
      <text x="40" y="28">150</text>
    </g>

    <!-- bars: below the threshold -->
    <g fill="#cfc4ad">
      <rect x="62"  y="238" width="60" height="6" />
      <rect x="148" y="133" width="60" height="111" />
      <rect x="236" y="39"  width="60" height="205" />
      <rect x="322" y="47"  width="60" height="197" />
    </g>
    <!-- bars: at or above the threshold -->
    <g fill="#45632f">
      <rect x="410" y="109" width="60" height="135" />
      <rect x="496" y="188" width="60" height="56" />
      <rect x="584" y="223" width="60" height="21" />
      <rect x="670" y="241" width="60" height="3" />
    </g>

    <!-- counts above each bar -->
    <g text-anchor="middle" font-size="12" font-variant-numeric="tabular-nums" fill="#211a12">
      <text x="92"  y="232">4</text>
      <text x="178" y="127">76</text>
      <text x="266" y="33">140</text>
      <text x="352" y="41">134</text>
      <text x="440" y="103">92</text>
      <text x="526" y="182">38</text>
      <text x="614" y="217">14</text>
      <text x="700" y="235">2</text>
    </g>

    <!-- bucket labels -->
    <g text-anchor="middle" font-size="12" font-variant-numeric="tabular-nums">
      <text x="92"  y="262">0.1</text>
      <text x="178" y="262">0.2</text>
      <text x="266" y="262">0.3</text>
      <text x="352" y="262">0.4</text>
      <text x="440" y="262">0.5</text>
      <text x="526" y="262">0.6</text>
      <text x="614" y="262">0.7</text>
      <text x="700" y="262">0.8</text>
    </g>
    <text x="396" y="284" text-anchor="middle" font-size="12" fill="#5d4632">interest probability, in ten-point buckets</text>

    <!-- the threshold -->
    <line x1="396" y1="18" x2="396" y2="252" stroke="#7d5714" stroke-width="2" />
    <text x="404" y="16" font-size="12" font-weight="600" fill="#7d5714">the WHERE clause cuts here</text>
    <text x="48" y="308" font-size="12" fill="#5d4632">500 stories scored &#183; median 0.42 &#183; 134 kept</text>
  </g>
</svg>
