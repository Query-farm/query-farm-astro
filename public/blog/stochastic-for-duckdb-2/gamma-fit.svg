<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif">
<title id="title">The fitted gamma density over the fifteen repair times</title>
<desc id="desc">Fifteen repair times between 0.4 and 5.3 hours, drawn as dots and as a histogram of one-hour bins: 4 repairs under 1 hour, 5 between 1 and 2, 3 between 2 and 3, 2 between 3 and 4 and 1 between 5 and 6. The fitted gamma density (shape 2.49, scale 0.79) rises from zero, peaks near 1.2 hours and has a long right tail that covers the 5.3-hour repair.</desc>
