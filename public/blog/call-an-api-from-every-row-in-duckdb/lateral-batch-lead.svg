<svg xmlns="http://www.w3.org/2000/svg" width="720" height="156" viewBox="0 0 720 156" role="img" aria-labelledby="title desc">
  <title id="title">Three places in, one VGI batch, four correlated rows out</title>
  <desc id="desc">Three input rows, Glen Allen VA, a place that does not exist, and Ocean City, merge into one VGI batch for LATERAL geocoding(p.city). Two strands come out: Glen Allen returns one row tagged parent 0, Ocean City returns three rows tagged parent 2, and the missing place returns nothing.</desc>
  <defs>
    <style>
      text { font-family: Commissioner, Inter, system-ui, sans-serif; fill: #211a12; }
      .label { font-size: 12px; font-weight: 520; }
      .idx { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10.5px; fill: #7d5714; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; fill: #5d4632; }
      .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; fill: #f0c877; }
      .inverse { font-size: 11px; fill: #f4ece0; }
      .note { font-size: 10.5px; fill: #5d4632; }
      .strand { fill: none; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <!-- strands: inputs converge into one batch -->
  <path class="strand" stroke="#c08e2f" d="M180 39C244 39 246 70 304 70"/>
  <path class="strand" stroke="#8a5f38" d="M180 78H304"/>
  <path class="strand" stroke="#45632f" d="M180 117C244 117 246 86 304 86"/>

  <!-- strands: the batch fans back out; row 1 produced nothing -->
  <path class="strand" stroke="#c08e2f" d="M416 70C472 70 474 23 528 23"/>
  <path class="strand" stroke="#45632f" d="M416 86C472 86 474 85 528 85"/>
  <path class="strand" stroke="#45632f" d="M416 86C472 86 474 113 528 113"/>
  <path class="strand" stroke="#45632f" d="M416 86C472 86 474 141 528 141"/>

  <!-- call site -->
  <text x="360" y="30" text-anchor="middle" class="mono">LATERAL geocoding(p.city)</text>

  <!-- the VGI boundary -->
  <rect x="300" y="44" width="120" height="68" rx="10" fill="#211a12"/>
  <text x="360" y="72" text-anchor="middle" class="eyebrow">VGI</text>
  <text x="360" y="93" text-anchor="middle" class="inverse">one Arrow batch</text>
  <text x="360" y="132" text-anchor="middle" class="note">3 rows in · 4 rows out</text>

  <!-- input rows -->
  <g>
    <rect x="12" y="24" width="168" height="30" rx="7" fill="#f6ddab"/>
    <rect x="12" y="24" width="6" height="30" rx="3" fill="#c08e2f"/>
    <text x="28" y="43" class="label">Glen Allen, VA</text>
    <text x="170" y="43" text-anchor="end" class="idx">0</text>

    <rect x="12" y="63" width="168" height="30" rx="7" fill="#efe9db"/>
    <rect x="12" y="63" width="6" height="30" rx="3" fill="#8a5f38"/>
    <text x="28" y="82" class="label">No such place zxqv</text>
    <text x="170" y="82" text-anchor="end" class="idx">1</text>

    <rect x="12" y="102" width="168" height="30" rx="7" fill="#e7efd9"/>
    <rect x="12" y="102" width="6" height="30" rx="3" fill="#45632f"/>
    <text x="28" y="121" class="label">Ocean City</text>
    <text x="170" y="121" text-anchor="end" class="idx">2</text>
  </g>

  <!-- output rows, each tagged with its parent_row -->
  <g>
    <rect x="528" y="12" width="180" height="22" rx="6" fill="#f6ddab"/>
    <rect x="528" y="12" width="6" height="22" rx="3" fill="#c08e2f"/>
    <text x="542" y="27" class="label">Glen Allen · Virginia</text>
    <text x="698" y="27" text-anchor="end" class="idx">0</text>

    <rect x="528" y="74" width="180" height="22" rx="6" fill="#e7efd9"/>
    <rect x="528" y="74" width="6" height="22" rx="3" fill="#45632f"/>
    <text x="542" y="89" class="label">Ocean City · Florida</text>
    <text x="698" y="89" text-anchor="end" class="idx">2</text>

    <rect x="528" y="102" width="180" height="22" rx="6" fill="#e7efd9"/>
    <rect x="528" y="102" width="6" height="22" rx="3" fill="#45632f"/>
    <text x="542" y="117" class="label">Ocean City · Maryland</text>
    <text x="698" y="117" text-anchor="end" class="idx">2</text>

    <rect x="528" y="130" width="180" height="22" rx="6" fill="#e7efd9"/>
    <rect x="528" y="130" width="6" height="22" rx="3" fill="#45632f"/>
    <text x="542" y="145" class="label">Ocean City · New Jersey</text>
    <text x="698" y="145" text-anchor="end" class="idx">2</text>
  </g>
</svg>
