<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">The stock and VGI query plans make different numbers of function calls</title>
  <desc id="desc">With DuckDB's stock table-in-out operator, each of three correlated input rows makes a separate function call. PhysicalVgiLateralBatch sends the same three rows together in one Arrow batch and makes one batched call.</desc>
  <defs>
    <marker id="arrow-stock" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#9a6b3f"/>
    </marker>
    <marker id="arrow-batch" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#45632f"/>
    </marker>
    <style>
      text { font-family: Commissioner, Inter, system-ui, sans-serif; fill: #211a12; }
      .eyebrow { font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; fill: #7d5714; }
      .heading { font-size: 16px; font-weight: 650; }
      .label { font-size: 12px; font-weight: 520; }
      .small { font-size: 10.5px; fill: #5d4632; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10.5px; }
      .inverse { fill: #f4ece0; }
      .warm { fill: #f0c877; }
    </style>
  </defs>

  <rect width="760" height="430" rx="16" fill="#f7f3ea"/>
  <text x="28" y="31" class="eyebrow">How VGI batches the API work</text>
  <text x="28" y="57" class="heading">The SQL is identical. The function sees one row—or a whole chunk.</text>

  <rect x="28" y="80" width="338" height="309" rx="12" fill="#fffdf7" stroke="#cfc4ad"/>
  <text x="48" y="107" class="eyebrow">Stock DuckDB path</text>
  <text x="48" y="130" class="mono">PhysicalTableInOutFunction</text>

  <text x="48" y="157" class="small">left rows</text>
  <rect x="48" y="168" width="105" height="40" rx="7" fill="#f6ddab"/>
  <rect x="48" y="216" width="105" height="40" rx="7" fill="#efe9db"/>
  <rect x="48" y="264" width="105" height="40" rx="7" fill="#e7efd9"/>
  <text x="59" y="192" class="label">Glen Allen</text>
  <text x="59" y="240" class="label">No match</text>
  <text x="59" y="288" class="label">Ocean City</text>

  <rect x="254" y="180" width="90" height="112" rx="10" fill="#211a12"/>
  <text x="299" y="205" text-anchor="middle" class="eyebrow warm">API function</text>
  <text x="299" y="230" text-anchor="middle" class="small inverse">call 1</text>
  <text x="299" y="250" text-anchor="middle" class="small inverse">call 2</text>
  <text x="299" y="270" text-anchor="middle" class="small inverse">call 3</text>

  <line x1="159" y1="188" x2="246" y2="216" stroke="#9a6b3f" stroke-width="1.6" marker-end="url(#arrow-stock)"/>
  <line x1="159" y1="236" x2="246" y2="236" stroke="#9a6b3f" stroke-width="1.6" marker-end="url(#arrow-stock)"/>
  <line x1="159" y1="284" x2="246" y2="256" stroke="#9a6b3f" stroke-width="1.6" marker-end="url(#arrow-stock)"/>
  <text x="198" y="177" text-anchor="middle" class="small">one row each</text>

  <rect x="48" y="326" width="296" height="42" rx="8" fill="#f1e6d7"/>
  <text x="196" y="351" text-anchor="middle" class="label">3 input rows → 3 separate calls</text>

  <rect x="394" y="80" width="338" height="309" rx="12" fill="#fffdf7" stroke="#cfc4ad"/>
  <text x="414" y="107" class="eyebrow">VGI batched path</text>
  <text x="414" y="130" class="mono">PhysicalVgiLateralBatch</text>

  <text x="414" y="157" class="small">one input chunk</text>
  <rect x="414" y="168" width="105" height="136" rx="9" fill="#e7efd9" stroke="#9db17c"/>
  <rect x="425" y="180" width="83" height="30" rx="6" fill="#f6ddab"/>
  <rect x="425" y="218" width="83" height="30" rx="6" fill="#efe9db"/>
  <rect x="425" y="256" width="83" height="30" rx="6" fill="#dce9ca"/>
  <text x="466.5" y="199" text-anchor="middle" class="small">Glen Allen</text>
  <text x="466.5" y="237" text-anchor="middle" class="small">No match</text>
  <text x="466.5" y="275" text-anchor="middle" class="small">Ocean City</text>

  <line x1="527" y1="236" x2="616" y2="236" stroke="#45632f" stroke-width="3" marker-end="url(#arrow-batch)"/>
  <text x="571" y="219" text-anchor="middle" class="small">one Arrow batch</text>

  <rect x="624" y="180" width="88" height="112" rx="10" fill="#211a12"/>
  <text x="668" y="205" text-anchor="middle" class="eyebrow warm">API function</text>
  <text x="668" y="233" text-anchor="middle" class="small inverse">all inputs</text>
  <text x="668" y="252" text-anchor="middle" class="small inverse">arrive</text>
  <text x="668" y="271" text-anchor="middle" class="small inverse">together</text>

  <rect x="414" y="326" width="298" height="42" rx="8" fill="#e7efd9"/>
  <text x="563" y="351" text-anchor="middle" class="label">3 input rows → 1 batched call</text>

  <text x="28" y="414" class="small">At scale, the batched path invokes the function roughly once per DuckDB input chunk—not once per row.</text>
</svg>
