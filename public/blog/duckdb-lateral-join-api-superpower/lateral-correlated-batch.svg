<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">A batched correlated lateral join</title>
  <desc id="desc">Three rows on the left are sent to one VGI function batch. Glen Allen produces one result row, a missing place produces none, and Ocean City produces three East Coast results. Colored parent row markers associate every result with the left row that produced it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d5714"/>
    </marker>
    <style>
      text { font-family: Commissioner, Inter, system-ui, sans-serif; fill: #211a12; }
      .eyebrow { font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; fill: #7d5714; }
      .heading { font-size: 17px; font-weight: 650; }
      .label { font-size: 13px; font-weight: 520; }
      .small { font-size: 11px; fill: #5d4632; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; }
      .inverse { fill: #f4ece0; }
      .warm { fill: #f0c877; }
    </style>
  </defs>

  <rect width="760" height="470" rx="16" fill="#f7f3ea"/>
  <text x="32" y="34" class="eyebrow">Correlated, but not row-at-a-time</text>
  <text x="32" y="61" class="heading">One left-hand chunk crosses the VGI boundary as one Arrow batch</text>

  <rect x="32" y="91" width="216" height="318" rx="12" fill="#fffdf7" stroke="#cfc4ad"/>
  <text x="52" y="120" class="eyebrow">Left table</text>
  <text x="52" y="145" class="heading">places</text>

  <rect x="48" y="164" width="184" height="58" rx="8" fill="#f6ddab"/>
  <rect x="48" y="164" width="7" height="58" rx="3.5" fill="#c08e2f"/>
  <text x="69" y="188" class="small">parent row 0</text>
  <text x="69" y="209" class="label">Glen Allen, VA</text>

  <rect x="48" y="232" width="184" height="58" rx="8" fill="#efe9db"/>
  <rect x="48" y="232" width="7" height="58" rx="3.5" fill="#8a5f38"/>
  <text x="69" y="256" class="small">parent row 1</text>
  <text x="69" y="277" class="label">No such place</text>

  <rect x="48" y="300" width="184" height="58" rx="8" fill="#e7efd9"/>
  <rect x="48" y="300" width="7" height="58" rx="3.5" fill="#45632f"/>
  <text x="69" y="324" class="small">parent row 2</text>
  <text x="69" y="345" class="label">Ocean City</text>

  <text x="52" y="386" class="small">3 correlated arguments</text>

  <line x1="261" y1="188" x2="334" y2="188" stroke="#7d5714" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="297" y="172" text-anchor="middle" class="small">one batch</text>

  <rect x="336" y="112" width="156" height="152" rx="12" fill="#211a12"/>
  <text x="414" y="143" text-anchor="middle" class="eyebrow warm">VGI function</text>
  <text x="414" y="172" text-anchor="middle" class="label inverse">deduplicate</text>
  <text x="414" y="196" text-anchor="middle" class="label inverse">batch or fan out</text>
  <text x="414" y="220" text-anchor="middle" class="label inverse">call the API</text>
  <path d="M 368 239 H 460" stroke="#7a9a54" stroke-width="3" stroke-linecap="round"/>

  <rect x="330" y="291" width="168" height="85" rx="10" fill="#efe9db" stroke="#cfc4ad"/>
  <text x="414" y="315" text-anchor="middle" class="eyebrow">Provenance</text>
  <text x="414" y="342" text-anchor="middle" class="mono">parent_row</text>
  <text x="414" y="362" text-anchor="middle" class="mono">[0, 2, 2, 2]</text>

  <line x1="505" y1="188" x2="548" y2="188" stroke="#7d5714" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="550" y="91" width="178" height="318" rx="12" fill="#fffdf7" stroke="#cfc4ad"/>
  <text x="570" y="120" class="eyebrow">Right rows</text>
  <text x="570" y="143" class="mono">geocoding(</text>
  <text x="570" y="158" class="mono">places.city)</text>

  <rect x="566" y="174" width="146" height="44" rx="7" fill="#f6ddab"/>
  <rect x="566" y="174" width="7" height="44" rx="3.5" fill="#c08e2f"/>
  <text x="585" y="201" class="label">Glen Allen, VA</text>

  <line x1="570" y1="254" x2="708" y2="254" stroke="#a9825a" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="639" y="242" text-anchor="middle" class="small">0 rows</text>

  <rect x="566" y="278" width="146" height="36" rx="7" fill="#e7efd9"/>
  <rect x="566" y="278" width="7" height="36" rx="3.5" fill="#45632f"/>
  <text x="585" y="301" class="label">Ocean City, FL</text>
  <rect x="566" y="320" width="146" height="36" rx="7" fill="#e7efd9"/>
  <rect x="566" y="320" width="7" height="36" rx="3.5" fill="#45632f"/>
  <text x="585" y="343" class="label">Ocean City, MD</text>
  <rect x="566" y="362" width="146" height="36" rx="7" fill="#e7efd9"/>
  <rect x="566" y="362" width="7" height="36" rx="3.5" fill="#45632f"/>
  <text x="585" y="385" class="label">Ocean City, NJ</text>

  <text x="32" y="445" class="small">The colored edge is the correlation: every output row keeps the left row that produced it.</text>
</svg>
