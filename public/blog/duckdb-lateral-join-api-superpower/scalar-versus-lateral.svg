<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
  <title id="title">A scalar function compared with a lateral table function</title>
  <desc id="desc">A scalar function maps the Ocean City input row to exactly one value. A lateral table function can map the same input row to zero, one, or many rows; the example shows three East Coast Ocean City matches.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#7d5714"/>
    </marker>
    <style>
      text { font-family: Commissioner, Inter, system-ui, sans-serif; fill: #211a12; }
      .eyebrow { font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; fill: #7d5714; }
      .heading { font-size: 17px; font-weight: 650; }
      .label { font-size: 13px; font-weight: 520; }
      .small { font-size: 11px; fill: #5d4632; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }
      .inverse { fill: #f4ece0; }
      .warm { fill: #f0c877; }
    </style>
  </defs>

  <rect width="760" height="350" rx="16" fill="#f7f3ea"/>
  <text x="28" y="31" class="eyebrow">Why a scalar function is not enough</text>

  <rect x="28" y="51" width="704" height="102" rx="12" fill="#fffdf7" stroke="#cfc4ad"/>
  <text x="48" y="77" class="eyebrow">Scalar function · exactly 1 value</text>
  <rect x="48" y="91" width="150" height="42" rx="7" fill="#efe9db"/>
  <text x="123" y="117" text-anchor="middle" class="label">Ocean City</text>
  <line x1="210" y1="112" x2="284" y2="112" stroke="#7d5714" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="286" y="87" width="184" height="50" rx="9" fill="#211a12"/>
  <text x="378" y="108" text-anchor="middle" class="mono warm">upper(city)</text>
  <text x="378" y="126" text-anchor="middle" class="small inverse">one value in the same row</text>
  <line x1="482" y1="112" x2="555" y2="112" stroke="#7d5714" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="557" y="91" width="155" height="42" rx="7" fill="#f6ddab"/>
  <text x="634.5" y="117" text-anchor="middle" class="mono">OCEAN CITY</text>

  <rect x="28" y="169" width="704" height="151" rx="12" fill="#fffdf7" stroke="#cfc4ad"/>
  <text x="48" y="195" class="eyebrow">Lateral table function · 0…N rows</text>
  <rect x="48" y="218" width="150" height="42" rx="7" fill="#e7efd9"/>
  <text x="123" y="244" text-anchor="middle" class="label">Ocean City</text>
  <line x1="210" y1="239" x2="284" y2="239" stroke="#45632f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="286" y="214" width="184" height="50" rx="9" fill="#211a12"/>
  <text x="378" y="235" text-anchor="middle" class="mono warm">geocoding(city)</text>
  <text x="378" y="253" text-anchor="middle" class="small inverse">a relation, not one value</text>
  <path d="M482 239 C520 239 516 214 550 214 M482 239 H550 M482 239 C520 239 516 264 550 264" fill="none" stroke="#45632f" stroke-width="2"/>
  <rect x="557" y="199" width="155" height="30" rx="6" fill="#e7efd9"/>
  <rect x="557" y="233" width="155" height="30" rx="6" fill="#e7efd9"/>
  <rect x="557" y="267" width="155" height="30" rx="6" fill="#e7efd9"/>
  <text x="570" y="219" class="small">Ocean City, New Jersey</text>
  <text x="570" y="253" class="small">Ocean City, Maryland</text>
  <text x="570" y="287" class="small">Ocean City, Florida</text>

  <text x="28" y="341" class="small">For another input, the right side may be empty. That variable row count is the point.</text>
</svg>
