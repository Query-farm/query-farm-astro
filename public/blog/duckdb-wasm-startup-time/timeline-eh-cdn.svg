<svg xmlns="http://www.w3.org/2000/svg" width="760" height="262" viewBox="0 0 760 262" role="img" aria-labelledby="title desc" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif">
<title id="title">Six extensions over the CDN, single-threaded build</title>
<desc id="desc">Drawn to scale from median timings. Without prefetch, the six LOAD statements take 2,188 ms one after another. With prefetch, downloading, hashing and compiling all six, plus the avro and parquet extensions iceberg loads, in parallel takes 540 ms and the six LOADs then take 758 ms, 1,298 ms in total.</desc>
<style>.h{font-size:15px;font-weight:700;fill:#211a12}.b{font-size:14px;font-weight:600;fill:#211a12}.m{font-size:12px;fill:#5b4f40}.seg{font-size:12.5px;font-weight:600;fill:#211a12}.segm{font-size:11.5px;fill:#4a3f31}</style>
<text class="h" x="24" y="30">Six extensions over the CDN, single-threaded build</text>
<text class="b" x="100" y="86" text-anchor="end">LOAD only</text>
<text class="m" x="100" y="103" text-anchor="end">one after another</text>
<rect x="112.0" y="64" width="77.9" height="44" fill="#f6e7c4" stroke="#c08e2f" stroke-width="1.2"/>
<text class="seg" x="150.9" y="83" text-anchor="middle">icu</text>
<text class="segm" x="150.9" y="99" text-anchor="middle">306 ms</text>
<rect x="189.9" y="64" width="37.7" height="44" fill="#efd9a6" stroke="#c08e2f" stroke-width="1.2"/>
<rect x="227.6" y="64" width="208.5" height="44" fill="#f6e7c4" stroke="#c08e2f" stroke-width="1.2"/>
<text class="seg" x="331.8" y="83" text-anchor="middle">spatial</text>
<text class="segm" x="331.8" y="99" text-anchor="middle">820 ms</text>
<rect x="436.1" y="64" width="141.0" height="44" fill="#efd9a6" stroke="#c08e2f" stroke-width="1.2"/>
<text class="seg" x="506.6" y="83" text-anchor="middle">iceberg</text>
<text class="segm" x="506.6" y="99" text-anchor="middle">555 ms</text>
<rect x="577.1" y="64" width="43.7" height="44" fill="#f6e7c4" stroke="#c08e2f" stroke-width="1.2"/>
<rect x="620.8" y="64" width="47.2" height="44" fill="#efd9a6" stroke="#c08e2f" stroke-width="1.2"/>
<text class="b" x="676.0" y="91">2,188 ms</text>
<text class="b" x="100" y="172" text-anchor="end">Prefetch</text>
<text class="m" x="100" y="189" text-anchor="end">then LOAD</text>
