<text class="seg" x="180.6" y="169" text-anchor="middle">prefetch</text>
<text class="segm" x="180.6" y="185" text-anchor="middle">540 ms</text>
<rect x="249.3" y="150" width="23.1" height="44" fill="#efd9a6" stroke="#c08e2f" stroke-width="1.2"/>
<rect x="272.4" y="150" width="10.1" height="44" fill="#f6e7c4" stroke="#c08e2f" stroke-width="1.2"/>
<rect x="282.5" y="150" width="85.5" height="44" fill="#efd9a6" stroke="#c08e2f" stroke-width="1.2"/>
<text class="seg" x="325.2" y="169" text-anchor="middle">spatial</text>
<text class="segm" x="325.2" y="185" text-anchor="middle">336 ms</text>
