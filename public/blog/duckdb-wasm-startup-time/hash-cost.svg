<svg xmlns="http://www.w3.org/2000/svg" width="760" height="534" viewBox="0 0 760 534" role="img" aria-labelledby="title desc" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif">
<title id="title">Hashing each extension file before its signature check</title>
<desc id="desc">Median SHA-256 time per extension file on the single-threaded build. icu (6.8 MB): 46 ms in the engine, 7 ms with WebCrypto; autocomplete (3.7 MB): 26 ms in the engine, 4 ms with WebCrypto; spatial (25.8 MB): 176 ms in the engine, 28 ms with WebCrypto; iceberg (8.5 MB): 58 ms in the engine, 9 ms with WebCrypto; avro (0.6 MB): 4 ms in the engine, under 1 ms with WebCrypto; parquet (4.4 MB): 30 ms in the engine, 5 ms with WebCrypto; grainlift (5.3 MB): 36 ms in the engine, 6 ms with WebCrypto; ducklake (3.7 MB): 25 ms in the engine, 4 ms with WebCrypto. All eight files: 400 ms in the engine against 62 ms with WebCrypto.</desc>
<style>.h{font-size:15px;font-weight:700;fill:#211a12}.b{font-size:14px;font-weight:600;fill:#211a12}.m{font-size:12px;fill:#5b4f40}.v{font-size:12px;font-weight:600;fill:#211a12}.t{font-size:13px;fill:#211a12}</style>
<text class="h" x="24" y="30">Hashing each extension file before its signature check</text>
<rect x="24" y="48" width="12" height="12" rx="3" fill="#446f22"/><text class="m" x="42" y="58">SHA-256 in the engine, compiled to WebAssembly (LOAD without prefetch)</text>
<rect x="24" y="66" width="12" height="12" rx="3" fill="#c08e2f"/><text class="m" x="42" y="76">WebCrypto, native in the browser (prefetchExtensions)</text>
<text class="b" x="138" y="106" text-anchor="end">icu</text>
<text class="m" x="138" y="122" text-anchor="end">6.8 MB</text>
<rect x="150" y="96" width="138.3" height="13" rx="3" fill="#446f22"/>
<text class="v" x="294.3" y="107">46 ms</text>
<rect x="150" y="113" width="21.1" height="13" rx="3" fill="#c08e2f"/>
<text class="v" x="177.1" y="124">7 ms</text>
<text class="b" x="138" y="152" text-anchor="end">autocomplete</text>
<text class="m" x="138" y="168" text-anchor="end">3.7 MB</text>
<rect x="150" y="142" width="77.0" height="13" rx="3" fill="#446f22"/>
<text class="v" x="233.0" y="153">26 ms</text>
<rect x="150" y="159" width="11.5" height="13" rx="3" fill="#c08e2f"/>
<text class="v" x="167.5" y="170">4 ms</text>
<text class="b" x="138" y="198" text-anchor="end">spatial</text>
<text class="m" x="138" y="214" text-anchor="end">25.8 MB</text>
<rect x="150" y="188" width="530.0" height="13" rx="3" fill="#446f22"/>
<text class="v" x="686.0" y="199">176 ms</text>
<rect x="150" y="205" width="83.7" height="13" rx="3" fill="#c08e2f"/>
<text class="v" x="239.7" y="216">28 ms</text>
<text class="b" x="138" y="244" text-anchor="end">iceberg</text>
<text class="m" x="138" y="260" text-anchor="end">8.5 MB</text>
<rect x="150" y="234" width="173.9" height="13" rx="3" fill="#446f22"/>
<text class="v" x="329.9" y="245">58 ms</text>
<rect x="150" y="251" width="27.2" height="13" rx="3" fill="#c08e2f"/>
<text class="v" x="183.2" y="262">9 ms</text>
<text class="b" x="138" y="290" text-anchor="end">avro</text>
<text class="m" x="138" y="306" text-anchor="end">0.6 MB</text>
<rect x="150" y="280" width="13.3" height="13" rx="3" fill="#446f22"/>
<text class="v" x="169.3" y="291">4 ms</text>
<rect x="150" y="297" width="1.5" height="13" rx="3" fill="#c08e2f"/>
<text class="v" x="157.5" y="308">&lt;1 ms</text>
<text class="b" x="138" y="336" text-anchor="end">parquet</text>
<text class="m" x="138" y="352" text-anchor="end">4.4 MB</text>
<rect x="150" y="326" width="90.3" height="13" rx="3" fill="#446f22"/>
<text class="v" x="246.3" y="337">30 ms</text>
<rect x="150" y="343" width="13.9" height="13" rx="3" fill="#c08e2f"/>
<text class="v" x="169.9" y="354">5 ms</text>
<text class="b" x="138" y="382" text-anchor="end">grainlift</text>
<text class="m" x="138" y="398" text-anchor="end">5.3 MB</text>
<rect x="150" y="372" width="108.1" height="13" rx="3" fill="#446f22"/>
<text class="v" x="264.1" y="383">36 ms</text>
<rect x="150" y="389" width="16.9" height="13" rx="3" fill="#c08e2f"/>
<text class="v" x="172.9" y="400">6 ms</text>
<text class="b" x="138" y="428" text-anchor="end">ducklake</text>
<text class="m" x="138" y="444" text-anchor="end">3.7 MB</text>
<rect x="150" y="418" width="76.7" height="13" rx="3" fill="#446f22"/>
<text class="v" x="232.7" y="429">25 ms</text>
<rect x="150" y="435" width="11.5" height="13" rx="3" fill="#c08e2f"/>
<text class="v" x="167.5" y="446">4 ms</text>
<path d="M24 454H736" stroke="#d9cdb6" stroke-width="1"/>
<text class="b" x="138" y="478" text-anchor="end">All eight</text>
<text class="m" x="138" y="494" text-anchor="end">59 MB</text>
<text class="t" x="150" y="478"><tspan fill="#446f22">■</tspan> 400 ms in the engine, one file after another</text>
<text class="t" x="150" y="496"><tspan fill="#c08e2f">■</tspan> 62 ms with WebCrypto, 6.4× less, while the other files download</text>
</svg>