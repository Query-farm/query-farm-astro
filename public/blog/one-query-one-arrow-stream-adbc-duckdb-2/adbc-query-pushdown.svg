<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc">
  <title id="title">How much of the query runs remotely?</title>
  <desc id="desc">Two vertical execution paths compare ADBC table scans with DuckDB 2.0 whole-query pushdown. In the table-scan path, PostgreSQL runs table-level selects, ADBC returns many Arrow rows, and DuckDB finishes joins and aggregation locally. With DuckDB 2.0, adbc_scanner validates a complete QueryNode, PostgreSQL runs the supported query, and ADBC returns only the final result.</desc>
  <defs>
    <marker id="arrow-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#9a6b3f"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#45632f"/>
    </marker>
    <style>
      text { font-family: Commissioner, Inter, system-ui, sans-serif; fill: #211a12; }
      .title { font-size: 17px; font-weight: 680; letter-spacing: .025em; }
      .subtitle { font-size: 12px; fill: #5d4632; }
      .eyebrow { font-size: 10.5px; font-weight: 680; letter-spacing: .08em; }
      .panel-title { font-size: 17px; font-weight: 650; }
      .step-title { font-size: 12.5px; font-weight: 620; }
      .small { font-size: 10.5px; fill: #5d4632; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10px; }
      .number { font-size: 10px; font-weight: 700; }
    </style>
  </defs>

  <rect width="760" height="650" rx="16" fill="#f7f3ea"/>

  <!-- DuckDB mark -->
  <g transform="translate(28 19) scale(.1)">
    <path fill="#1a1a1a" d="M249.9996737,500C111.9320267,500,0,388.068425,0,250.0000251,0,111.9318259,111.3637372,0,249.9996737,0,388.6367145,0,500,111.9318259,500,250.0000251c0,138.0683999-111.9317506,249.9999749-250.0003263,249.9999749Z"/>
    <path fill="#fff100" d="M190.0545045,146.5907724c-56.8184727,0-103.4089829,46.5908427-103.4089829,103.4092276,0,57.3868501,46.5905102,103.4092401,103.4089829,103.4092401,56.8183974,0,103.4091523-46.5908552,103.4091523-103.4092401s-46.5907549-103.4092401-103.4091523-103.4092276Z"/>
    <path fill="#fff100" d="M376.1380597,212.7835876h-49.1467777v74.432875h49.1467777c20.5540155,0,37.2164375-16.6623467,37.2164375-37.2164375v-.0000753c0-20.5540155-16.662422-37.2163622-37.2164375-37.2163622Z"/>
  </g>
  <text x="94" y="39" class="title">HOW MUCH OF THE QUERY RUNS REMOTELY?</text>
  <text x="94" y="61" class="subtitle">ADBC sends SQL in both cases. DuckDB 2.0 sends a larger piece of the plan.</text>
  <line x1="28" y1="87" x2="732" y2="87" stroke="#cfc4ad"/>

  <!-- Table-scan path -->
  <rect x="28" y="106" width="338" height="496" rx="10" fill="#fffdf7" stroke="#cfc4ad"/>
  <text x="48" y="134" class="eyebrow" fill="#7d5714">TABLE-SCAN PATH</text>
  <text x="48" y="159" class="panel-title">Remote reads, local query</text>
  <text x="48" y="178" class="small">PostgreSQL supplies rows; DuckDB finishes the plan.</text>

  <line x1="64" y1="211" x2="64" y2="519" stroke="#c6ae8a" stroke-width="1.5"/>
  <line x1="64" y1="251" x2="64" y2="277" stroke="#9a6b3f" stroke-width="1.5" marker-end="url(#arrow-warm)"/>
  <line x1="64" y1="351" x2="64" y2="377" stroke="#9a6b3f" stroke-width="1.5" marker-end="url(#arrow-warm)"/>
  <line x1="64" y1="451" x2="64" y2="477" stroke="#9a6b3f" stroke-width="1.5" marker-end="url(#arrow-warm)"/>

  <circle cx="64" cy="218" r="14" fill="#fffdf7" stroke="#9a6b3f" stroke-width="1.5"/>
  <text x="64" y="222" text-anchor="middle" class="number">1</text>
  <text x="92" y="213" class="step-title">DuckDB creates a local plan</text>
  <text x="92" y="232" class="small">One remote scan for each table</text>

  <circle cx="64" cy="318" r="14" fill="#f6ddab" stroke="#9a6b3f" stroke-width="1.5"/>
  <text x="64" y="322" text-anchor="middle" class="number">2</text>
  <rect x="88" y="288" width="250" height="60" rx="5" fill="#f6ddab"/>
  <text x="104" y="312" class="step-title">PostgreSQL runs table-level SQL</text>
  <text x="104" y="332" class="mono">SELECT columns … WHERE filter …</text>

  <circle cx="64" cy="418" r="14" fill="#fffdf7" stroke="#9a6b3f" stroke-width="1.5"/>
  <text x="64" y="422" text-anchor="middle" class="number">3</text>
  <text x="92" y="413" class="step-title">ADBC returns Arrow batches</text>
  <text x="92" y="432" class="small">Many source rows cross the boundary</text>

  <circle cx="64" cy="518" r="14" fill="#211a12"/>
  <text x="64" y="522" text-anchor="middle" class="number" style="fill:#fffdf7">4</text>
  <rect x="88" y="488" width="250" height="60" rx="5" fill="#211a12"/>
  <text x="104" y="512" class="step-title" style="fill:#fffdf7">DuckDB finishes the query</text>
  <text x="104" y="532" class="mono" style="fill:#fffdf7">JOIN · GROUP BY · ORDER BY</text>

  <text x="48" y="579" class="small">Remote work: scans and supported filters</text>

  <!-- Whole-query path -->
  <rect x="394" y="106" width="338" height="496" rx="10" fill="#fffdf7" stroke="#9db17c" stroke-width="1.5"/>
  <text x="414" y="134" class="eyebrow" fill="#45632f">DUCKDB 2.0</text>
  <text x="414" y="159" class="panel-title">The supported query stays remote</text>
  <text x="414" y="178" class="small">DuckDB receives the finished result.</text>

  <line x1="430" y1="211" x2="430" y2="519" stroke="#9db17c" stroke-width="1.5"/>
  <line x1="430" y1="251" x2="430" y2="277" stroke="#45632f" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="430" y1="351" x2="430" y2="377" stroke="#45632f" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="430" y1="451" x2="430" y2="477" stroke="#45632f" stroke-width="2" marker-end="url(#arrow-green)"/>

  <circle cx="430" cy="218" r="14" fill="#e7efd9" stroke="#45632f" stroke-width="1.5"/>
  <text x="430" y="222" text-anchor="middle" class="number">1</text>
  <text x="458" y="213" class="step-title">DuckDB keeps the complete QueryNode</text>
  <text x="458" y="232" class="small">The relationship between operations remains</text>

  <circle cx="430" cy="318" r="14" fill="#e7efd9" stroke="#45632f" stroke-width="1.5"/>
  <text x="430" y="322" text-anchor="middle" class="number">2</text>
  <rect x="454" y="288" width="250" height="60" rx="5" fill="#e7efd9"/>
  <text x="470" y="312" class="step-title">adbc_scanner checks the dialect</text>
  <text x="470" y="332" class="small">Every operation must keep its meaning</text>

  <circle cx="430" cy="418" r="14" fill="#45632f"/>
  <text x="430" y="422" text-anchor="middle" class="number" style="fill:#fffdf7">3</text>
  <rect x="454" y="380" width="250" height="76" rx="5" fill="#45632f"/>
  <text x="470" y="404" class="step-title" style="fill:#fffdf7">PostgreSQL runs one complete query</text>
  <text x="470" y="425" class="mono" style="fill:#fffdf7">SELECT · JOIN · WHERE</text>
  <text x="470" y="442" class="mono" style="fill:#fffdf7">GROUP BY · ORDER BY</text>

  <circle cx="430" cy="518" r="14" fill="#e7efd9" stroke="#45632f" stroke-width="1.5"/>
  <text x="430" y="522" text-anchor="middle" class="number">4</text>
  <text x="458" y="513" class="step-title">ADBC returns the final Arrow result</text>
  <text x="458" y="532" class="small">Only the result rows cross the boundary</text>

  <text x="414" y="579" class="small">Remote work: the complete supported query</text>

  <text x="28" y="630" class="small">If the dialect check rejects any operation, DuckDB safely uses the table-scan path.</text>
</svg>
