<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5d4632"/></marker></defs>
<rect width="760" height="400" fill="#f7f3ea"/>
<text x="24" y="32" font-size="15" fill="#a9762e" text-anchor="start" font-weight="700">Previous release</text>
<rect x="24" y="48" width="336" height="100" rx="6" fill="#e6dbc255" stroke="#7a5230" stroke-width="1.5"/>
<text x="38" y="70" font-size="12.5" fill="#211a12" text-anchor="start" font-weight="600">DuckDB aggregate memory</text>
<text x="38" y="87" font-size="11" fill="#5d4632" text-anchor="start" font-weight="400">counted toward memory_limit, can spill</text>
<rect x="38" y="102" width="96" height="30" rx="3" fill="#f7f3ea" stroke="#7a5230" stroke-width="1.5"/>
<text x="86" y="121" font-size="10.5" fill="#211a12" text-anchor="middle" font-weight="400">state 1: pointer</text>
<line x1="86" y1="132" x2="86" y2="196" stroke="#5d4632" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="144" y="102" width="96" height="30" rx="3" fill="#f7f3ea" stroke="#7a5230" stroke-width="1.5"/>
<text x="192" y="121" font-size="10.5" fill="#211a12" text-anchor="middle" font-weight="400">state 2: pointer</text>
<line x1="192" y1="132" x2="192" y2="196" stroke="#5d4632" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="250" y="102" width="96" height="30" rx="3" fill="#f7f3ea" stroke="#7a5230" stroke-width="1.5"/>
<text x="298" y="121" font-size="10.5" fill="#211a12" text-anchor="middle" font-weight="400">state 3: pointer</text>
<line x1="298" y1="132" x2="298" y2="196" stroke="#5d4632" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="24" y="182" width="336" height="186" rx="6" fill="none" stroke="#a9762e" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="38" y="198" width="96" height="66" rx="4" fill="#f7f3ea" stroke="#a9762e" stroke-width="1.5"/>
<text x="86" y="226" font-size="11" fill="#211a12" text-anchor="middle" font-weight="400">full sketch</text>
<text x="86" y="243" font-size="10.5" fill="#5d4632" text-anchor="middle" font-weight="400">~1.6 KB at birth</text>
<rect x="144" y="198" width="96" height="66" rx="4" fill="#f7f3ea" stroke="#a9762e" stroke-width="1.5"/>
<text x="192" y="226" font-size="11" fill="#211a12" text-anchor="middle" font-weight="400">full sketch</text>
<text x="192" y="243" font-size="10.5" fill="#5d4632" text-anchor="middle" font-weight="400">~1.6 KB at birth</text>
<rect x="250" y="198" width="96" height="66" rx="4" fill="#f7f3ea" stroke="#a9762e" stroke-width="1.5"/>
<text x="298" y="226" font-size="11" fill="#211a12" text-anchor="middle" font-weight="400">full sketch</text>
<text x="298" y="243" font-size="10.5" fill="#5d4632" text-anchor="middle" font-weight="400">~1.6 KB at birth</text>
<text x="38" y="296" font-size="12.5" fill="#211a12" text-anchor="start" font-weight="600">C++ heap</text>
<text x="38" y="313" font-size="11" fill="#5d4632" text-anchor="start" font-weight="400">invisible to DuckDB: not counted toward</text>
<text x="38" y="329" font-size="11" fill="#5d4632" text-anchor="start" font-weight="400">memory_limit and never spills</text>
<text x="400" y="32" font-size="15" fill="#2e5fb8" text-anchor="start" font-weight="700">DuckDB 2.0 release</text>
<rect x="400" y="48" width="336" height="212" rx="6" fill="#2e5fb80f" stroke="#2e5fb8" stroke-width="1.5"/>
<text x="414" y="70" font-size="12.5" fill="#211a12" text-anchor="start" font-weight="600">DuckDB aggregate arena</text>
<text x="414" y="87" font-size="11" fill="#5d4632" text-anchor="start" font-weight="400">counted toward memory_limit, can spill</text>
<rect x="414" y="102" width="148" height="40" rx="4" fill="#f7f3ea" stroke="#2e5fb8" stroke-width="1.5"/>
<text x="422" y="119" font-size="11" fill="#211a12" text-anchor="start" font-weight="400">state 1: buffer</text>
<text x="422" y="134" font-size="10.5" fill="#5d4632" text-anchor="start" font-weight="400">up to 32 values</text>
<rect x="574" y="102" width="148" height="40" rx="4" fill="#f7f3ea" stroke="#2e5fb8" stroke-width="1.5"/>
<text x="582" y="119" font-size="11" fill="#211a12" text-anchor="start" font-weight="400">state 2: buffer</text>
<text x="582" y="134" font-size="10.5" fill="#5d4632" text-anchor="start" font-weight="400">a few values</text>
<rect x="414" y="152" width="308" height="52" rx="4" fill="#f7f3ea" stroke="#2e5fb8" stroke-width="1.5"/>
<text x="422" y="171" font-size="11" fill="#211a12" text-anchor="start" font-weight="400">state 3: sketch, built after 32 values</text>
<text x="422" y="188" font-size="10.5" fill="#5d4632" text-anchor="start" font-weight="400">it and everything it allocates live in the arena</text>
<rect x="414" y="214" width="308" height="32" rx="4" fill="#f7f3ea" stroke="#cfc4ad" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="422" y="234" font-size="10.5" fill="#5d4632" text-anchor="start" font-weight="400">scratch arena: temporaries, freed after each call</text>
<line x1="568" y1="260" x2="568" y2="290" stroke="#5d4632" stroke-width="1.5" marker-end="url(#head)"/>
<text x="578" y="280" font-size="10.5" fill="#5d4632" text-anchor="start" font-weight="400">memory runs short</text>
<rect x="400" y="292" width="336" height="76" rx="6" fill="#f7f3ea" stroke="#7a5230" stroke-width="1.5"/>
<text x="414" y="314" font-size="12.5" fill="#211a12" text-anchor="start" font-weight="600">Spill to disk</text>
<text x="414" y="332" font-size="11" fill="#5d4632" text-anchor="start" font-weight="400">buffers are written as raw values,</text>
<text x="414" y="348" font-size="11" fill="#5d4632" text-anchor="start" font-weight="400">sketches as serialized bytes</text>
</svg>