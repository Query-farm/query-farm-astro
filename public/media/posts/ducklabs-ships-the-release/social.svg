<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The Foundation owns the IP. DuckLabs ships the release.</title>
  <desc id="desc">A typography-led Query.Farm social card for an article about DuckDB governance and release distribution.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ed"/>
      <stop offset="1" stop-color="#f3ecdd"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="24" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .045"/></feComponentTransfer>
    </filter>
    <clipPath id="qf-mark"><circle cx="88" cy="70" r="20"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" filter="url(#grain)" opacity=".65"/>

  <!-- Current Query.Farm mark and wordmark; no product logo or illustration. -->
  <g clip-path="url(#qf-mark)">
    <rect x="68" y="50" width="40" height="10" fill="#f0c877"/>
    <rect x="68" y="60" width="40" height="10" fill="#d9a441"/>
    <rect x="68" y="70" width="40" height="10" fill="#a9762e"/>
    <rect x="68" y="80" width="40" height="10" fill="#7a5230"/>
  </g>
  <text x="119" y="80" fill="#251d15" font-family="Georgia, serif" font-size="32" font-weight="700">Query.Farm</text>
  <text x="1132" y="77" text-anchor="end" fill="#80541f" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.35">NOTES FROM THE FARM · AUG 26, 2026</text>
  <path d="M68 116H1132" stroke="#b99052" stroke-width="1"/>

  <text x="68" y="178" fill="#80541f" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">DUCKDB · GOVERNANCE · DISTRIBUTION</text>

  <text x="68" y="267" fill="#251d15" font-family="Georgia, serif" font-size="61" font-weight="700" letter-spacing="-.8">
    <tspan x="68" dy="0">The Foundation owns the IP.</tspan>
    <tspan x="68" dy="76">DuckLabs ships the release.</tspan>
  </text>

  <path d="M68 403H1132" stroke="#d4c4a9" stroke-width="1"/>
  <text x="68" y="451" fill="#655344" font-family="Arial, sans-serif" font-size="21">
    Governance protects the project. Distribution decides what ships.
  </text>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#644c38">
    <rect x="68" y="528" width="76" height="31" rx="15.5" fill="#fffaf0" stroke="#cdbb9d"/>
    <text x="106" y="548" text-anchor="middle">DuckDB</text>
    <rect x="154" y="528" width="100" height="31" rx="15.5" fill="#fffaf0" stroke="#cdbb9d"/>
    <text x="204" y="548" text-anchor="middle">Governance</text>
    <rect x="264" y="528" width="104" height="31" rx="15.5" fill="#fffaf0" stroke="#cdbb9d"/>
    <text x="316" y="548" text-anchor="middle">Distribution</text>
  </g>
  <text x="1132" y="548" text-anchor="end" fill="#80541f" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".6">QUERY.FARM / BLOG</text>

  <g transform="translate(0 624)">
    <rect width="200" height="6" fill="#eef0e3"/><rect x="200" width="200" height="6" fill="#d8dfbf"/>
    <rect x="400" width="200" height="6" fill="#a9b77d"/><rect x="600" width="200" height="6" fill="#74874f"/>
    <rect x="800" width="200" height="6" fill="#4c6238"/><rect x="1000" width="200" height="6" fill="#293722"/>
  </g>
</svg>
