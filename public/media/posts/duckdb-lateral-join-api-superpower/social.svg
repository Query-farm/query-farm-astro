<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">DuckDB’s LATERAL Join Is an API Superpower</title>
  <desc id="desc">Query.Farm social card showing three correlated input rows flowing through one batched table-function call and producing zero, one, or many output rows.</desc>
  <defs>
    <clipPath id="qf-mark"><circle cx="88" cy="70" r="20"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#f7f3ea"/>
  <image href="social-illustration.png" x="0" y="0" width="1200" height="630" preserveAspectRatio="xMidYMid slice"/>

  <g clip-path="url(#qf-mark)">
    <rect x="68" y="50" width="40" height="10" fill="#f0c877"/>
    <rect x="68" y="60" width="40" height="10" fill="#d9a441"/>
    <rect x="68" y="70" width="40" height="10" fill="#a9762e"/>
    <rect x="68" y="80" width="40" height="10" fill="#7a5230"/>
  </g>
  <text x="119" y="80" fill="#211a12" font-family="Petrona, Georgia, serif" font-size="32" font-weight="700">Query.Farm</text>

  <path d="M68 150H505" stroke="#b99052" stroke-width="1"/>
  <text x="68" y="133" fill="#7d5714" font-family="Commissioner, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.45">NOTES FROM THE FARM</text>

  <text x="68" y="218" fill="#211a12" font-family="Petrona, Georgia, serif" font-size="55" font-weight="700" letter-spacing="-.7">DuckDB’s</text>
  <text x="68" y="284" fill="#211a12" font-family="JetBrains Mono, Menlo, monospace" font-size="42" font-weight="700" letter-spacing="-1">LATERAL</text>
  <text x="270" y="284" fill="#211a12" font-family="Petrona, Georgia, serif" font-size="55" font-weight="700" letter-spacing="-.7">Join</text>
  <text x="68" y="350" fill="#211a12" font-family="Petrona, Georgia, serif" font-size="55" font-weight="700" letter-spacing="-.7">Is an API</text>
  <text x="68" y="416" fill="#211a12" font-family="Petrona, Georgia, serif" font-size="55" font-weight="700" letter-spacing="-.7">Superpower</text>

  <text x="68" y="464" fill="#5d4632" font-family="Commissioner, Arial, sans-serif" font-size="18">Correlated rows. Batched API calls.</text>

  <g font-family="Commissioner, Arial, sans-serif" font-size="13" font-weight="700" fill="#5d4632">
    <rect x="68" y="528" width="76" height="31" rx="15.5" fill="#fffaf0" stroke="#cfc4ad"/>
    <text x="106" y="548" text-anchor="middle">DuckDB</text>
    <rect x="154" y="528" width="54" height="31" rx="15.5" fill="#fffaf0" stroke="#cfc4ad"/>
    <text x="181" y="548" text-anchor="middle">VGI</text>
    <rect x="218" y="528" width="55" height="31" rx="15.5" fill="#fffaf0" stroke="#cfc4ad"/>
    <text x="245.5" y="548" text-anchor="middle">SQL</text>
  </g>

  <text x="1132" y="548" text-anchor="end" fill="#7d5714" font-family="Commissioner, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".6">QUERY.FARM / BLOG</text>

  <g transform="translate(0 624)">
    <rect width="200" height="6" fill="#eef0e3"/><rect x="200" width="200" height="6" fill="#d8dfbf"/>
    <rect x="400" width="200" height="6" fill="#a9b77d"/><rect x="600" width="200" height="6" fill="#74874f"/>
    <rect x="800" width="200" height="6" fill="#4c6238"/><rect x="1000" width="200" height="6" fill="#293722"/>
  </g>
</svg>
