<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">DuckDB 2.0 Pushes Whole Queries Through ADBC—10–11× Faster on PostgreSQL</title>
  <desc id="desc">Query.Farm social card highlighting a same-host PostgreSQL benchmark in which DuckDB 2.0 whole-query pushdown through ADBC ran two queries 10 to 11 times faster.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ed"/>
      <stop offset="1" stop-color="#f2ecdf"/>
    </linearGradient>
    <clipPath id="qf-mark"><circle cx="88" cy="70" r="20"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>

  <g clip-path="url(#qf-mark)">
    <rect x="68" y="50" width="40" height="10" fill="#f0c877"/>
    <rect x="68" y="60" width="40" height="10" fill="#d9a441"/>
    <rect x="68" y="70" width="40" height="10" fill="#a9762e"/>
    <rect x="68" y="80" width="40" height="10" fill="#7a5230"/>
  </g>
  <text x="119" y="80" fill="#211a12" font-family="Georgia, serif" font-size="32" font-weight="700">Query.Farm</text>
  <text x="1132" y="77" text-anchor="end" fill="#7d5714" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.35">NOTES FROM THE FARM · SEP 13, 2026</text>
  <path d="M68 116H1132" stroke="#b99052" stroke-width="1"/>

  <text x="68" y="165" fill="#7d5714" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">DUCKDB 2.0 · ADBC · POSTGRESQL</text>

  <g fill="#211a12" font-family="Georgia, serif" font-size="55" font-weight="700" letter-spacing="-.7">
    <text x="68" y="246">DuckDB 2.0 Pushes</text>
    <text x="68" y="312">Whole Queries</text>
    <text x="68" y="378">Through ADBC</text>
  </g>

  <text x="68" y="478" fill="#5d4632" font-family="Arial, sans-serif" font-size="20">The remote database does the work. DuckDB reads the result.</text>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#5d4632">
    <rect x="68" y="528" width="76" height="31" rx="15.5" fill="#fffaf0" stroke="#cfc4ad"/>
    <text x="106" y="548" text-anchor="middle">DuckDB</text>
    <rect x="154" y="528" width="60" height="31" rx="15.5" fill="#fffaf0" stroke="#cfc4ad"/>
    <text x="184" y="548" text-anchor="middle">ADBC</text>
    <rect x="224" y="528" width="100" height="31" rx="15.5" fill="#fffaf0" stroke="#cfc4ad"/>
    <text x="274" y="548" text-anchor="middle">PostgreSQL</text>
  </g>

  <rect x="756" y="157" width="376" height="356" rx="18" fill="#fffdf7" stroke="#a9b77d" stroke-width="1.5"/>

  <g transform="translate(788 183) scale(.12)">
    <path fill="#1a1a1a" d="M249.9996737,500C111.9320267,500,0,388.068425,0,250.0000251,0,111.9318259,111.3637372,0,249.9996737,0,388.6367145,0,500,111.9318259,500,250.0000251c0,138.0683999-111.9317506,249.9999749-250.0003263,249.9999749Z"/>
    <path fill="#fff100" d="M190.0545045,146.5907724c-56.8184727,0-103.4089829,46.5908427-103.4089829,103.4092276,0,57.3868501,46.5905102,103.4092401,103.4089829,103.4092401,56.8183974,0,103.4091523-46.5908552,103.4091523-103.4092401s-46.5907549-103.4092401-103.4091523-103.4092276Z"/>
    <path fill="#fff100" d="M376.1380597,212.7835876h-49.1467777v74.432875h49.1467777c20.5540155,0,37.2164375-16.6623467,37.2164375-37.2164375v-.0000753c0-20.5540155-16.662422-37.2163622-37.2163622-37.2163622Z"/>
  </g>

  <text x="872" y="202" fill="#45632f" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.25">WHOLE-QUERY PUSHDOWN</text>
  <text x="788" y="333" fill="#293722" font-family="Georgia, serif" font-size="80" font-weight="700" letter-spacing="-2">10–11×</text>
  <text x="792" y="367" fill="#45632f" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2.4">FASTER</text>
  <text x="792" y="400" fill="#5d4632" font-family="Arial, sans-serif" font-size="15">in our same-host PostgreSQL benchmark</text>
  <path d="M792 428H1096" stroke="#d8dfbf"/>
  <text x="792" y="458" fill="#5d4632" font-family="Arial, sans-serif" font-size="15">5,000,000 rows</text>
  <path d="M930 453H1000" stroke="#74874f" stroke-width="2"/>
  <path d="m994 448 8 5-8 5" fill="none" stroke="#74874f" stroke-width="2"/>
  <text x="1016" y="458" fill="#293722" font-family="Arial, sans-serif" font-size="15" font-weight="700">100</text>
  <text x="792" y="488" fill="#5d4632" font-family="Arial, sans-serif" font-size="15">50,100 rows</text>
  <path d="M900 483H1000" stroke="#74874f" stroke-width="2"/>
  <path d="m994 478 8 5-8 5" fill="none" stroke="#74874f" stroke-width="2"/>
  <text x="1016" y="488" fill="#293722" font-family="Arial, sans-serif" font-size="15" font-weight="700">1</text>

  <text x="1132" y="548" text-anchor="end" fill="#7d5714" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".6">QUERY.FARM / BLOG</text>

  <g transform="translate(0 624)">
    <rect width="200" height="6" fill="#eef0e3"/><rect x="200" width="200" height="6" fill="#d8dfbf"/>
    <rect x="400" width="200" height="6" fill="#a9b77d"/><rect x="600" width="200" height="6" fill="#74874f"/>
    <rect x="800" width="200" height="6" fill="#4c6238"/><rect x="1000" width="200" height="6" fill="#293722"/>
  </g>
</svg>
