<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 188" role="img"
     aria-label="Discrete global grid cell shapes: H3 uses hexagons, S2 uses squares, A5 uses pentagons"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- H3 — hexagon -->
  <polygon points="122,72 101,108.4 59,108.4 38,72 59,35.6 101,35.6"
           fill="#dcfce7" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="80" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#3d342a">H3</text>
  <text x="80" y="152" text-anchor="middle" font-size="12" fill="#8a754f">hexagons</text>

  <!-- S2 — curvilinear square -->
  <path d="M202,34 Q240,28 278,34 Q284,72 278,110 Q240,116 202,110 Q196,72 202,34 Z"
        fill="#dcfce7" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="240" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#3d342a">S2</text>
  <text x="240" y="152" text-anchor="middle" font-size="12" fill="#8a754f">squares</text>

  <!-- A5 — pentagon (highlighted) -->
  <polygon points="400,26 443.8,57.8 427,109.2 373,109.2 356.2,57.8"
           fill="#fef3c7" stroke="#d97706" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="400" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">A5</text>
  <text x="400" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">pentagons</text>

  <!-- caption -->
  <text x="240" y="178" text-anchor="middle" font-size="11" fill="#8a754f">Each tiles the globe into integer cell IDs — A5's pentagons stay equal-area worldwide.</text>
</svg>
