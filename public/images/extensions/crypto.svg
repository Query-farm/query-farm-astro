<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Subtle gradient background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad1)"/>

  <!-- Lock icon (simplified crypto icon) -->
  <g transform="translate(600, 240)">
    <circle cx="0" cy="0" r="120" fill="#0f172a" opacity="0.05"/>
    <text x="0" y="0" font-size="180" text-anchor="middle" dominant-baseline="middle">🔐</text>
  </g>

  <!-- Extension name -->
  <text x="600" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#0f172a" text-anchor="middle">
    Crypto Functions
  </text>

  <!-- Subtitle -->
  <text x="600" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#64748b" text-anchor="middle">
    DuckDB Extension
  </text>
</svg>
