<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a1a"/>
      <stop offset="100%" style="stop-color:#0d2818"/>
    </linearGradient>
    <linearGradient id="harvestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f7f6f4" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#3d342a">Crypto Extension Architecture</text>

  <!-- Input Layer -->
  <rect x="50" y="70" width="140" height="80" rx="8" fill="url(#greenGrad)"/>
  <text x="120" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8f5e9">SQL Query</text>
  <text x="120" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#a5d6a7">crypto_sha256(data)</text>

  <!-- Arrow 1 -->
  <path d="M 195 110 L 245 110" stroke="#66bb6a" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- DuckDB Core -->
  <rect x="250" y="60" width="160" height="100" rx="8" fill="#fff" stroke="#d3cab9" stroke-width="2"/>
  <text x="330" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#3d342a">DuckDB Core</text>
  <text x="330" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5a4a36">Query Parser</text>
  <text x="330" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5a4a36">Optimizer</text>
  <text x="330" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5a4a36">Executor</text>

  <!-- Arrow 2 -->
  <path d="M 415 110 L 465 110" stroke="#66bb6a" stroke-width="2" fill="none"/>

  <!-- Crypto Extension -->
  <rect x="470" y="60" width="160" height="100" rx="8" fill="url(#harvestGrad)"/>
  <text x="550" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff">Crypto Extension</text>
  <text x="550" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dcfce7">Vectorized Functions</text>
  <text x="550" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dcfce7">OpenSSL Backend</text>
  <text x="550" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dcfce7">SIMD Optimizations</text>

  <!-- Arrow 3 -->
  <path d="M 635 110 L 685 110" stroke="#66bb6a" stroke-width="2" fill="none"/>

  <!-- Output -->
  <rect x="690" y="70" width="80" height="80" rx="8" fill="url(#greenGrad)"/>
  <text x="730" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8f5e9">Result</text>
  <text x="730" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#a5d6a7">Hash/Cipher</text>

  <!-- Data Flow Section -->
  <text x="400" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#3d342a">Vectorized Data Flow</text>

  <!-- Vector chunks -->
  <g transform="translate(100, 220)">
    <rect width="120" height="50" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" font-family="monospace" font-size="10" fill="#92400e">Vector Chunk</text>
    <text x="60" y="35" text-anchor="middle" font-family="monospace" font-size="9" fill="#b45309">~2048 rows</text>
  </g>

  <path d="M 225 245 L 275 245" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>

  <g transform="translate(280, 220)">
    <rect width="120" height="50" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" font-family="monospace" font-size="10" fill="#166534">Hash Operation</text>
    <text x="60" y="35" text-anchor="middle" font-family="monospace" font-size="9" fill="#15803d">SIMD parallel</text>
  </g>

  <path d="M 405 245 L 455 245" stroke="#22c55e" stroke-width="2" stroke-dasharray="4"/>

  <g transform="translate(460, 220)">
    <rect width="120" height="50" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e40af">Output Vector</text>
    <text x="60" y="35" text-anchor="middle" font-family="monospace" font-size="9" fill="#1d4ed8">~2048 hashes</text>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 320)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3d342a">Processing Pipeline:</text>
    <rect x="0" y="15" width="12" height="12" rx="2" fill="url(#greenGrad)"/>
    <text x="20" y="25" font-family="system-ui, sans-serif" font-size="10" fill="#5a4a36">SQL Interface</text>
    <rect x="120" y="15" width="12" height="12" rx="2" fill="#fff" stroke="#d3cab9"/>
    <text x="140" y="25" font-family="system-ui, sans-serif" font-size="10" fill="#5a4a36">DuckDB Core</text>
    <rect x="240" y="15" width="12" height="12" rx="2" fill="url(#harvestGrad)"/>
    <text x="260" y="25" font-family="system-ui, sans-serif" font-size="10" fill="#5a4a36">Crypto Extension</text>
  </g>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#66bb6a"/>
    </marker>
  </defs>
</svg>
