name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run check

      - run: npm run test:haybarn-functions

      - name: Check contact tracking and delivery webhooks
        run: node --import tsx --test tests/enquiry.test.mjs tests/enquiry-webhook.test.mjs tests/enquiry-browser.test.mjs

      - run: npm run test:haybarn-extensions

      - run: npm run validate

      - name: Prepare native DuckDB documentation tests
        run: |
          python3 -m venv .cache/extension-install-tests
          .cache/extension-install-tests/bin/python -m pip install -r tests/extensions/native-requirements.txt

      - name: Check extension installation documentation
        env:
          DUCKDB_TEST_PYTHON: .cache/extension-install-tests/bin/python
        run: npm run test:extension-install

      - run: npm run test:haybarn-exports

      - name: Run browser tests
        id: browser_tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/browser-results.json
        run: npm run test:haybarn-browser -- --workers=4 --reporter=line,json

      - name: Upload failed browser test results
        if: ${{ !cancelled() && steps.browser_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

      - run: npm run check:pages-functions

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=query-farm-website --branch=${{ github.head_ref || github.ref_name }}

      - name: Add deployment URL to summary
        run: |
          {
            echo "### Cloudflare Pages deployment"
            echo "- URL: ${{ steps.deploy.outputs.deployment-url }}"
            echo "- Alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
