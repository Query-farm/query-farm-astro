<!doctype html><meta charset="utf-8"><title>Codex · VGI live build</title><link rel="stylesheet" href="/xterm.css"><style>
*{box-sizing:border-box}body{margin:0;padding:26px 38px;background:#121212;color:#eee;font:17px system-ui}header{display:flex;justify-content:space-between;align-items:center;height:58px;margin-bottom:14px;border-bottom:1px solid #444}header strong{font-weight:500}header span{color:#aaa;font-size:14px}#terminal{height:820px}footer{font-size:14px;color:#aaa;display:flex;justify-content:space-between;padding-top:18px} .xterm{padding:0}
</style><header><strong>Codex builds a GitHub → DuckDB integration</strong><span>Live terminal capture · <b id="elapsed">0:00</b></span></header><div id="terminal"></div><footer><span>GitHub releases API + local project inventory · Python VGI worker</span><span>Query.Farm</span></footer><script src="/xterm.js"></script><script>
const terminal=new Terminal({cols:112,rows:34,fontSize:20,lineHeight:1.18,fontFamily:'Menlo,monospace',theme:{background:'#121212',foreground:'#e5e5e5'},cursorBlink:false,scrollback:8000});terminal.open(document.getElementById('terminal'));terminal.onData(data=>fetch('/input',{method:'POST',body:data}));let cursor=0;async function poll(){const result=await(await fetch('/events?after='+cursor)).json();for(const event of result.events){terminal.write(Uint8Array.from(atob(event.data),c=>c.charCodeAt(0)));}cursor=result.cursor;const s=Math.floor(result.elapsed);document.getElementById('elapsed').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');setTimeout(poll,100);}poll();window.terminal=terminal;
</script>
