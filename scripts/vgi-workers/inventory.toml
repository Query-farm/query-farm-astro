# Orchard worker inventory — which Query-farm repos the connector directory lists.
#
# `scripts/vgi-workers/harvest.py inventory` checks this file against GitHub. Every PUBLIC,
# non-archived Query-farm `vgi-*` repo with a published release must appear in exactly one
# of the two tables below, or the check fails and names it. That is the "did we forget a
# worker?" alarm: a new worker shows up as unclassified until someone adds it here.
#
# [include] — workers to list. A worker is harvested once its repo is public with a release;
#   until then the check reports it as "waiting" and skips it. Optional keys:
#     catalog  = ATTACH catalog name, when it is not the repo name minus "vgi-" (dashes → _)
#     script   = Python console script for uvx, when it is not "<repo>-worker"
#     run      = "docker" to attach the ghcr.io image instead of the release
#     location = an explicit LOCATION to attach (e.g. a hosted endpoint)
#   Language comes from GitHub.
#
# [exclude] — public, released repos that are not listed, with the reason.

[include]
vgi-adbc = {}
vgi-anomaly = {}
vgi-arcgis = {}
vgi-asn1 = {}
vgi-audio = {}
vgi-azure-cost = { catalog = "azure" }
vgi-azure-defender = { catalog = "azure" }
vgi-azure-directory = { catalog = "azure" }
vgi-azure-files = { catalog = "azure" }
